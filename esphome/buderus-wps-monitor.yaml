esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200
  logs:
    canbus: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret fallback_ap_password

captive_portal:

canbus:
  - platform: esp32_can
    id: can0
    rx_pin: GPIO21
    tx_pin: GPIO22
    bit_rate: 125KBPS
    mode: NORMAL
    rx_queue_len: 64
    can_id: 0x01FD7FE0
    use_extended_id: true

switch:
  - platform: template
    name: CAN sniffer log
    icon: mdi:magnify-scan
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: km273::dumper.set_sniff(true);
    turn_off_action:
      - lambda: km273::dumper.set_sniff(false);

button:
  - platform: restart
    name: Restart

interval:
  - interval: 5ms
    then:
      - lambda: |-
          km273::dumper.tick();
          km273::poller.tick();

sensor:
  - platform: template
    name: CAN frame rate
    icon: mdi:swap-horizontal
    unit_of_measurement: frames/s
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 30s
    lambda: return km273::dumper.report_stats();
