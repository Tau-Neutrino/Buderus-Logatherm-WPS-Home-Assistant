text_sensor:
  - platform: template
    name: "Operating mode"
    icon: mdi:heat-pump
    update_interval: 10s
    lambda: |-
      const float c = id(p_hw_compressor).state, v = id(p_hw_vxv).state;
      if (std::isnan(c)) return {"Unbekannt"};
      if (c < 0.5f) return {"Standby"};
      return {(!std::isnan(v) && v > 0.5f) ? "Warmwasser" : "Heizen"};

  # Flow with its setpoint for the "Vorlauf" tile, e.g. "25,4 °C (Soll: 28,2 °C)".
  - platform: template
    name: "Flow with setpoint"
    icon: mdi:radiator
    update_interval: 10s
    lambda: |-
      const float t = id(p_gt1_temp).state, s = id(p_heating_curve_value).state;
      if (std::isnan(t)) return {"—"};
      char buf[48];
      if (std::isnan(s))
        snprintf(buf, sizeof(buf), "%.1f °C", t);
      else
        snprintf(buf, sizeof(buf), "%.1f °C (Soll: %.1f °C)", t, s);
      std::string out(buf);
      for (auto &ch : out)
        if (ch == '.') ch = ',';
      return out;

binary_sensor:
  - platform: template
    name: "Compressor running"
    device_class: running
    lambda: return id(p_hw_compressor).state > 0.5f;
