# Copy this file to secrets.yaml (which is git-ignored) and fill in your values.
wifi_ssid: "MyWiFi"
wifi_password: "my-wifi-password"
# Password of the fallback hotspot the ESP32 opens when it cannot join your Wi-Fi.
fallback_ap_password: "choose-a-password"
ota_password: "choose-an-ota-password"
# 32-byte base64 key for the ESPHome native API. Generate one, e.g.:
#   python -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
api_encryption_key: "REPLACE_WITH_YOUR_OWN_BASE64_KEY_xxxxxxxxxxx="
