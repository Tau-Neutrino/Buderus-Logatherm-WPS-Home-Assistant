# Heat pump block on the Keller page (view path: technikraum), placed above "Waschmaschine".
# Needs HACS button-card (only the HACS version may be registered as a resource).
type: vertical-stack
cards:
- type: markdown
  content: '## 🔥 Wärmepumpe'
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .card-content {
        padding: 0 !important;
      }
      ha-markdown {
        text-align: center !important;
      }
      ha-markdown h2 {
        text-align: center !important;
        font-size: 1.6rem !important;
        font-weight: 800 !important;
        margin: 4px 0 !important;
      }
- type: custom:button-card
  show_name: false
  show_icon: false
  tap_action:
    action: navigate
    navigation_path: /lovelace/waermepumpe
  styles:
    card:
    - 'border-radius: 16px'
    - 'box-shadow: none'
    - 'padding: 0'
    - 'background: rgba(var(--rgb-primary-color), 0.05)'
    label:
    - 'width: 100%'
    - 'text-align: left'
    - 'padding: 0'
  show_label: true
  label: |
    [[[
      const g = (e) => states[e]?.state;
      const n = (e) => { const v = parseFloat(g(e)); return isNaN(v) ? '—' : v.toFixed(1).replace('.', ','); };
      const mode = g('sensor.haus_buderus_wps_operating_mode') ?? 'unknown';
      const map = { 'Heizen': ['🔥 Heizen', 'rgb(255,112,67)'], 'Warmwasser': ['🚿 Warmwasser', 'rgb(229,57,53)'], 'Standby': ['⚫ Standby', 'var(--primary-text-color)'] };
      const [text, color] = map[mode] ?? [`❓ ${mode}`, 'var(--primary-text-color)'];
      const cop = parseFloat(g('sensor.haus_buderus_wps_estimated_cop'));
      const copText = isNaN(cop) ? '' : ` <span style="font-size:0.85rem;font-weight:600;color:var(--secondary-text-color);">· COP ≈ ${cop.toFixed(1).replace('.', ',')}</span>`;
      const box = (t, v) => `
            <div style="flex:1;background:rgba(128,128,128,0.1);border-radius:12px;padding:10px 12px;">
              <div style="font-size:0.7rem;color:var(--secondary-text-color);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">${t}</div>
              <div style="font-size:1.1rem;font-weight:700;">${v}</div>
            </div>`;
      return `
        <div style="padding:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div style="font-size:1.25rem;font-weight:800;color:${color};">${text}${copText}</div>
            <ha-icon icon="mdi:chevron-right" style="color:var(--secondary-text-color);--mdc-icon-size:20px;width:20px;height:20px;"></ha-icon>
          </div>
          <div style="display:flex;gap:10px;">${box('Vorlauf', n('sensor.haus_buderus_wps_heating_flow_gt1') + ' °C')}${box('Warmwasser', n('sensor.haus_buderus_wps_hot_water_display') + ' °C')}${box('Außen', n('sensor.haus_buderus_wps_outdoor_gt2') + ' °C')}
          </div>
        </div>`;
    ]]]
