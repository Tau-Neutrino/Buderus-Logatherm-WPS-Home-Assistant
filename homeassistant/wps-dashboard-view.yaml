# Buderus WPS 8K-1 – overview page.
# Home Assistant: open the view > Edit > "Edit in YAML", replace everything with this file, save.
# Needs the HACS frontend card "plotly-graph-card" (hot water gauge, energy donuts, heating curve, COP charts).
# Everything else is built-in cards.
title: Heat pump
path: heat-pump
icon: mdi:heat-pump
type: sections
max_columns: 3
sections:
  # ---------------------------------------------------------------- Current status
  - type: grid
    cards:
      - type: heading
        heading: Current status
        icon: mdi:heat-pump-outline
      - type: tile
        entity: binary_sensor.haus_buderus_wps_compressor_running
        name: Compressor
        icon: mdi:engine
        color: green
      - type: tile
        entity: sensor.haus_buderus_wps_operating_mode
        name: Operating mode
        icon: mdi:valve
        color: orange
      - type: tile
        entity: sensor.haus_buderus_wps_flow_with_setpoint
        name: Flow
        # Text tile, but tapping opens the numeric flow sensor (curve instead of text history).
        tap_action:
          action: more-info
          entity: sensor.haus_buderus_wps_heating_flow_gt1
        icon_tap_action:
          action: more-info
          entity: sensor.haus_buderus_wps_heating_flow_gt1
        icon: mdi:radiator
        color: deep-orange
      - type: tile
        entity: sensor.haus_buderus_wps_outdoor_gt2
        name: Outdoor temperature
        icon: mdi:thermometer
        color: light-blue
      - type: tile
        entity: sensor.haus_buderus_wps_brine_in_gt10
        name: Brine inlet
        icon: mdi:arrow-down-bold-circle-outline
        color: cyan
      - type: tile
        entity: sensor.haus_buderus_wps_brine_out_gt11
        name: Brine outlet
        icon: mdi:arrow-up-bold-circle-outline
        color: blue
      # Hot water gauge: value as on the pump display (GT3 + offset); a charge starts below "Start" and ends at "Stop".
      - type: custom:plotly-graph
        raw_plotly_config: true
        grid_options:
          columns: full
          rows: 4
        config:
          displayModeBar: false
          staticPlot: true
        fn: |
          $fn ({ hass, vars }) => {
            const p = 'sensor.haus_buderus_wps_';
            const v = (id, d) => { const s = hass.states[p + id]; const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? d : n; };
            const off = v('hot_water_setpoint_offset', 0);
            vars.hw = v('hot_water_display', 0);
            vars.start = Math.round((v('hot_water_start', 40) + off) * 10) / 10;
            vars.stop = Math.round((v('hot_water_stop', 46) + off) * 10) / 10;
            vars.target = v('hot_water_setpoint', 50);
            // Target zone: between setpoint and stop (dark green, dotted outline).
            vars.zlo = Math.min(vars.target, vars.stop);
            vars.zhi = Math.max(vars.target, vars.stop);
          }
        entities:
          - type: indicator
            mode: gauge+number
            value: $fn ({ vars }) => vars.hw
            number:
              suffix: " °C"
              valueformat: ".1f"
              font:
                size: 36
            title:
              text: $fn ({ vars }) => `Hot water<br><span style="font-size:14px">Start ${vars.start.toFixed(1)} °C · Stop ${vars.stop.toFixed(1)} °C · Target ${vars.target.toFixed(0)} °C</span>`
              font:
                size: 20
            gauge:
              shape: angular
              axis:
                range: [40, 60]
                dtick: 5
              # No bar, the value is shown by the needle.
              bar:
                color: "rgba(0,0,0,0)"
                thickness: 0
              steps: |-
                $fn ({ vars }) => [
                  { range: [40, Math.max(40, vars.start)], color: '#bbdefb' },
                  { range: [Math.max(40, vars.start), Math.max(40, vars.zlo)], color: '#c8e6c9' },
                  { range: [Math.max(40, vars.zlo), Math.min(60, vars.zhi)], color: '#66bb6a' },
                  { range: [Math.min(60, vars.zhi), 60], color: '#ffe0b2' }
                ]
        # Needle = path shape in pixels around the centre of the arc. Plotly: radius = min(width/2, height of the
        # plot area), centre = bottom edge of the plot area. Height 215 − 70 − 10 = 135 px and
        # margin left/right 25 px: from 320 px card width on, the radius is always 135 px (width/2 ≥ height).
        # The needle starts at 0.66 r so it does not cover the number in the middle.
        layout:
          height: 215
          margin:
            t: 70
            b: 10
            l: 25
            r: 25
          shapes: |-
            $fn ({ vars }) => {
              const r = 135;
              const v = Math.min(60, Math.max(40, vars.hw));
              const a = Math.PI * (1 - (v - 40) / 20);
              const c = Math.cos(a), s = Math.sin(a);
              const r0 = 0.66 * r, r1 = 1.03 * r, w = 5;
              const pt = (d, o) => `${(d * c - o * s).toFixed(1)},${(d * s + o * c).toFixed(1)}`;
              // Dotted outline around the target zone: ring segment 0.75 r … r as a polygon (Plotly paths have no arcs).
              const ang = (x) => Math.PI * (1 - (Math.min(60, Math.max(40, x)) - 40) / 20);
              const a0 = ang(vars.zhi), a1 = ang(vars.zlo), n = 24, arc = [];
              for (let i = 0; i <= n; i++) { const t = a0 + (a1 - a0) * i / n; arc.push(`${(r * Math.cos(t)).toFixed(1)},${(r * Math.sin(t)).toFixed(1)}`); }
              for (let i = n; i >= 0; i--) { const t = a0 + (a1 - a0) * i / n; arc.push(`${(0.75 * r * Math.cos(t)).toFixed(1)},${(0.75 * r * Math.sin(t)).toFixed(1)}`); }
              const base = { type: 'path', layer: 'above', xref: 'paper', yref: 'paper', xsizemode: 'pixel', ysizemode: 'pixel', xanchor: 0.5, yanchor: 0 };
              return [{
                ...base,
                path: `M ${arc.join(' L ')} Z`,
                fillcolor: 'rgba(0,0,0,0)',
                line: { color: '#1b5e20', width: 1.5, dash: 'dot' },
              }, {
                ...base,
                path: `M ${pt(r0, w)} L ${pt(r1, 0)} L ${pt(r0, -w)} Z`,
                fillcolor: '#37474f',
                line: { color: '#263238', width: 1 },
              }];
            }

  # ---------------------------------------------------------------- Energy
  - type: grid
    cards:
      - type: heading
        heading: Energy
        icon: mdi:lightning-bolt
      # Heat produced as a donut: labels follow the ring, total in the middle.
      - type: custom:plotly-graph
        raw_plotly_config: true
        grid_options:
          columns: full
          rows: 6
        config:
          displayModeBar: false
          staticPlot: true
        fn: |
          $fn ({ hass, vars }) => {
            const p = 'sensor.haus_buderus_wps_';
            const v = (id) => { const s = hass.states[p + id]; const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? 0 : Math.round(n); };
            vars.values = [v('heat_produced_heating'), v('heat_produced_hot_water')];
            vars.total = (vars.values[0] + vars.values[1]).toLocaleString('en-US');
          }
        entities:
          - type: pie
            hole: 0.55
            sort: false
            direction: clockwise
            labels: ["Heating", "Hot water"]
            values: $fn ({ vars }) => vars.values
            marker:
              colors: ["#ffe0b2", "#ffcdd2"]
              line:
                color: "#444444"
                width: 1
            texttemplate: "%{value:,.0f} kWh<br>%{percent:.1%}"
            textposition: inside
            insidetextorientation: tangential
            textfont:
              color: "#000000"
              size: 14
            title:
              text: $fn ({ vars }) => `Heat produced<br><b>${vars.total} kWh</b>`
              position: middle center
              font:
                size: 16
        layout:
          height: 330
          separators: ".,"
          showlegend: true
          legend:
            orientation: h
            x: 0.5
            xanchor: center
            y: -0.05
          margin:
            t: 10
            b: 10
            l: 10
            r: 10
      # Heat produced in the last 24 h (sliding window, hours_to_show: 24):
      # last minus first value of each counter; the counter entities themselves are not drawn.
      - type: custom:plotly-graph
        raw_plotly_config: true
        hours_to_show: 24
        refresh_interval: 60
        grid_options:
          columns: full
          rows: 6
        config:
          displayModeBar: false
          staticPlot: true
        entities:
          - entity: sensor.haus_buderus_wps_heat_produced_heating
            internal: true
            fn: |
              $fn ({ ys, vars }) => {
                const n = ys.map(Number).filter((x) => !isNaN(x));
                vars.h = n.length > 1 ? Math.max(0, n[n.length - 1] - n[0]) : 0;
              }
          - entity: sensor.haus_buderus_wps_heat_produced_hot_water
            internal: true
            fn: |
              $fn ({ ys, vars }) => {
                const n = ys.map(Number).filter((x) => !isNaN(x));
                vars.w = n.length > 1 ? Math.max(0, n[n.length - 1] - n[0]) : 0;
                vars.total = (vars.h + vars.w).toLocaleString('en-US', { maximumFractionDigits: 1 });
              }
          - type: pie
            hole: 0.55
            sort: false
            direction: clockwise
            labels: ["Heating", "Hot water"]
            values: $fn ({ vars }) => [vars.h, vars.w]
            marker:
              colors: ["#ffe0b2", "#ffcdd2"]
              line:
                color: "#444444"
                width: 1
            texttemplate: "%{value:,.1f} kWh<br>%{percent:.1%}"
            textposition: inside
            insidetextorientation: tangential
            textfont:
              color: "#000000"
              size: 14
            title:
              text: $fn ({ vars }) => `Heat produced 24 h<br><b>${vars.total} kWh</b>`
              position: middle center
              font:
                size: 16
        layout:
          height: 330
          separators: ".,"
          showlegend: true
          legend:
            orientation: h
            x: 0.5
            xanchor: center
            y: -0.05
          margin:
            t: 10
            b: 10
            l: 10
            r: 10
      # Heat per day: last counter value of each day (statistic: state, period: day),
      # bar = difference to the previous day's last value (filter delta). Electricity = the Shelly's lifetime counter.
      - type: custom:plotly-graph
        title: Heat & electricity per day
        hours_to_show: 8d
        # Axis up to the end of today (not only up to "now"), otherwise today's bars are cut off.
        visible_range: |
          $fn () => { const d = new Date(); d.setHours(0, 0, 0, 0); return [+d - 7 * 86400000, +d + 86400000]; }
        refresh_interval: auto
        grid_options:
          columns: full
          rows: 6
        config:
          displayModeBar: false
          staticPlot: true
        entities:
          - entity: sensor.haus_buderus_wps_heat_produced_heating
            name: Heating
            statistic: state
            period: day
            filters:
              - delta
            type: bar
            # Fixed width/offset in ms (x = start of day): otherwise Plotly draws a single bar as a hairline.
            width: 24192000
            offset: 6912000
            texttemplate: "%{y:.0f}"
            textposition: outside
            marker:
              color: "#ffe0b2"
              line:
                color: "#444444"
                width: 1
          - entity: sensor.haus_buderus_wps_heat_produced_hot_water
            name: Hot water
            statistic: state
            period: day
            filters:
              - delta
            type: bar
            width: 24192000
            offset: 31104000
            texttemplate: "%{y:.0f}"
            textposition: outside
            marker:
              color: "#ffcdd2"
              line:
                color: "#444444"
                width: 1
          - entity: sensor.haus_wps_8k1_3em_pro_energy
            name: Electricity
            statistic: state
            period: day
            filters:
              - delta
            type: bar
            width: 24192000
            offset: 55296000
            texttemplate: "%{y:.1f}"
            textposition: outside
            marker:
              color: "#90caf9"
              line:
                color: "#444444"
                width: 1
        layout:
          height: 320
          separators: ".,"
          barmode: overlay
          showlegend: true
          legend:
            orientation: h
            x: 0
            y: 1.08
          margin:
            t: 40
            b: 40
            l: 50
            r: 10
          xaxis:
            tickformat: "%b %d"
            dtick: 86400000
            ticklabelmode: period
            fixedrange: true
          yaxis:
            title:
              text: kWh
            rangemode: tozero
            fixedrange: true
            gridcolor: "rgba(128,128,128,0.25)"

  # ---------------------------------------------------------------- COP estimated
  # COP estimated from the datasheet curves (brine in GT10, heat pump flow GT8), only while the compressor runs,
  # starting 1 min after compressor start or a switch between heating and hot water.
  - type: grid
    cards:
      - type: heading
        heading: COP estimated (datasheet curves)
        icon: mdi:chart-bell-curve
      - type: tile
        entity: sensor.haus_buderus_wps_estimated_cop
        name: COP now (estimated)
        icon: mdi:gauge
        color: green
        grid_options:
          columns: full
      - type: custom:plotly-graph
        title: COP per day (estimated, runtime average)
        hours_to_show: 7d
        refresh_interval: auto
        grid_options:
          columns: full
          rows: 6
        config:
          displayModeBar: false
          staticPlot: true
        entities:
          - entity: sensor.haus_buderus_wps_estimated_cop_heating
            name: Heating
            statistic: mean
            period: day
            type: bar
            texttemplate: "%{y:.2f}"
            textposition: outside
            marker:
              color: "#ffe0b2"
              line:
                color: "#444444"
                width: 1
          - entity: sensor.haus_buderus_wps_estimated_cop_hot_water
            name: Hot water
            statistic: mean
            period: day
            type: bar
            texttemplate: "%{y:.2f}"
            textposition: outside
            marker:
              color: "#ffcdd2"
              line:
                color: "#444444"
                width: 1
        layout:
          height: 320
          separators: ".,"
          barmode: group
          showlegend: true
          legend:
            orientation: h
            x: 0
            y: 1.08
          margin:
            t: 40
            b: 40
            l: 50
            r: 10
          xaxis:
            tickformat: "%b %d"
            dtick: 86400000
            fixedrange: true
          yaxis:
            title:
              text: COP
            rangemode: tozero
            fixedrange: true
            gridcolor: "rgba(128,128,128,0.25)"

  # ---------------------------------------------------------------- COP measured
  # Measured: electricity from the Shelly Pro 3EM, split into heating / hot water / standby (compressor +
  # diverter valve); heat from the pump's counters (homeassistant/wps-energy-package.yaml).
  # "COP last run" = heat ÷ electricity from compressor start to 60 s after the stop; "today" includes standby.
  - type: grid
    cards:
      - type: heading
        heading: COP measured
        icon: mdi:flash
      - type: tile
        entity: sensor.haus_wps_8k1_3em_pro_power
        name: Power now
        icon: mdi:flash
        color: amber
      - type: tile
        entity: sensor.wps_electricity_today
        name: Electricity today
        icon: mdi:lightning-bolt
        color: amber
      - type: tile
        entity: sensor.wps_cop_last_run
        name: COP last run
        icon: mdi:gauge
        color: green
      - type: tile
        entity: sensor.wps_cop_today
        name: COP (today)
        icon: mdi:gauge
        color: green
      - type: tile
        entity: sensor.wps_cop_heating_today
        name: COP (heating)
        icon: mdi:gauge
        color: deep-orange
      - type: tile
        entity: sensor.wps_cop_hot_water_today
        name: COP (hot water)
        icon: mdi:gauge
        color: blue
      # COP per day: last counter value per day (statistic: state, period: day), difference to the previous day,
      # heat ÷ electricity. No bar without a value for the previous day (installation day: electricity only since installation).
      # raw_plotly_config: otherwise the card forces a date axis via hours_to_show and the
      # category bars ("Nov 11") end up outside the visible range.
      - type: custom:plotly-graph
        title: COP per day (measured)
        raw_plotly_config: true
        hours_to_show: 8d
        refresh_interval: auto
        grid_options:
          columns: full
          rows: 6
        config:
          displayModeBar: false
          staticPlot: true
        fn: |
          $fn ({ vars }) => {
            const key = (d) => { const t = new Date(d); return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate(); };
            vars.key = key;
            vars.daily = (xs, ys) => {
              const m = {};
              xs.forEach((x, i) => { const n = Number(ys[i]); if (!isNaN(n)) m[key(x)] = n; });
              const out = {};
              Object.keys(m).forEach((k) => {
                const [y, mo, d] = k.split('-').map(Number);
                const p = m[key(new Date(y, mo - 1, d - 1))];
                if (p !== undefined) out[k] = m[k] - p;
              });
              return out;
            };
          }
        entities:
          - entity: sensor.haus_buderus_wps_heat_produced_heating
            statistic: state
            period: day
            internal: true
            fn: $fn ({ xs, ys, vars }) => { vars.qh = vars.daily(xs, ys); }
          - entity: sensor.haus_buderus_wps_heat_produced_hot_water
            statistic: state
            period: day
            internal: true
            fn: $fn ({ xs, ys, vars }) => { vars.qw = vars.daily(xs, ys); }
          - entity: sensor.wps_electricity_heating
            statistic: state
            period: day
            internal: true
            fn: $fn ({ xs, ys, vars }) => { vars.eh = vars.daily(xs, ys); }
          - entity: sensor.wps_electricity_hot_water
            statistic: state
            period: day
            internal: true
            fn: $fn ({ xs, ys, vars }) => { vars.ew = vars.daily(xs, ys); }
          # Total electricity: the Shelly's lifetime counter.
          - entity: sensor.haus_wps_8k1_3em_pro_energy
            statistic: state
            period: day
            internal: true
            fn: |
              $fn ({ xs, ys, vars }) => {
                vars.et = vars.daily(xs, ys);
                const days = [];
                for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push(d); }
                const r = (q, e) => (q !== undefined && e !== undefined && e >= 0.2) ? Math.round(q / e * 100) / 100 : null;
                vars.x = days.map((d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
                vars.h = days.map((d) => r(vars.qh[vars.key(d)], vars.eh[vars.key(d)]));
                vars.w = days.map((d) => r(vars.qw[vars.key(d)], vars.ew[vars.key(d)]));
                vars.t = days.map((d) => { const k = vars.key(d); const q = (vars.qh[k] ?? NaN) + (vars.qw[k] ?? NaN); return isNaN(q) ? null : r(q, vars.et[k]); });
              }
          - x: $fn ({ vars }) => vars.x
            y: $fn ({ vars }) => vars.h
            name: Heating
            type: bar
            texttemplate: "%{y:.2f}"
            textposition: outside
            marker:
              color: "#ffe0b2"
              line:
                color: "#444444"
                width: 1
          - x: $fn ({ vars }) => vars.x
            y: $fn ({ vars }) => vars.w
            name: Hot water
            type: bar
            texttemplate: "%{y:.2f}"
            textposition: outside
            marker:
              color: "#ffcdd2"
              line:
                color: "#444444"
                width: 1
          - x: $fn ({ vars }) => vars.x
            y: $fn ({ vars }) => vars.t
            name: Total incl. standby
            type: bar
            texttemplate: "%{y:.2f}"
            textposition: outside
            marker:
              color: "#c8e6c9"
              line:
                color: "#444444"
                width: 1
        layout:
          height: 320
          separators: ".,"
          barmode: group
          showlegend: true
          legend:
            orientation: h
            x: 0
            y: 1.08
          margin:
            t: 40
            b: 40
            l: 50
            r: 10
          xaxis:
            type: category
            fixedrange: true
          yaxis:
            title:
              text: COP
            # Fixed scale: highest bar + 20 % room for the label above the bar.
            range: $fn ({ vars }) => [0, Math.max(1, ...[...vars.h, ...vars.w, ...vars.t].filter((v) => v !== null)) * 1.2]
            fixedrange: true
            gridcolor: "rgba(128,128,128,0.25)"

  # ---------------------------------------------------------------- Heating curve
  - type: grid
    cards:
      - type: heading
        heading: Heating curve
        icon: mdi:chart-bell-curve-cumulative
      - type: custom:plotly-graph
        raw_plotly_config: true
        grid_options:
          columns: full
          rows: 7
        config:
          displayModeBar: false
          staticPlot: true
        fn: |
          $fn ({ hass, vars }) => {
            const p = 'sensor.haus_buderus_wps_';
            const v = (id, d) => { const s = hass.states[p + id]; const n = s ? parseFloat(s.state) : NaN; return isNaN(n) ? d : n; };
            const f1 = (n) => n.toFixed(1);
            const l = v('heating_curve_left_point_display', 26), r = v('heating_curve_right_point_display', 32);
            const rx = v('heating_curve_right_point_outdoor_temp', -15);
            const mn = v('heating_curve_min', 10), mx = v('heating_curve_max', 45);
            const n = Math.round(v('heating_curve_number_of_points', 8));
            // Points evenly spaced from +20 °C to the right point; point i gets the adjustment Yi.
            vars.px = []; vars.py = [];
            for (let i = 0; i < n; i++) {
              const x = 20 + i * (rx - 20) / (n - 1);
              const y = l + (20 - x) * (r - l) / (20 - rx) + v('heating_curve_adjustment_point_' + (i + 1), 0);
              vars.px.push(Math.round(x * 10) / 10);
              vars.py.push(Math.round(Math.min(mx, Math.max(mn, y)) * 10) / 10);
            }
            vars.label = vars.py.map(y => f1(y) + '°');
            const ox = v('outdoor_smoothed_gt2', 0), sy = v('flow_setpoint', 0), fy = v('heating_flow_gt1', 0);
            const st = v('heating_start_threshold', sy), sp = v('heating_stop_threshold', sy);
            vars.ox = [ox]; vars.sy = [sy]; vars.fy = [fy]; vars.st = [st]; vars.sp = [sp];
            // Fixed margin around the curve and the current values so the labels do not touch the edge.
            const all = vars.py.concat([sy, fy, st, sp]);
            vars.ylo = Math.floor(Math.min(...all) - 3);
            vars.yhi = Math.ceil(Math.max(...all) + 3);
            vars.padx = [ox, ox]; vars.pady = [vars.ylo, vars.yhi];
            // Dotted line at the current outdoor temperature: from the start to the stop threshold.
            vars.vx = [ox, ox]; vars.vy = [st, sp];
            vars.nOut = `Switching range at ${f1(ox)} °C outdoor (smoothed)`;
            vars.nStart = `Heating starts: ${f1(st)} °C`;
            vars.nStop = `Heating stops: ${f1(sp)} °C`;
            vars.nSoll = `Flow setpoint: ${f1(sy)} °C`;
            vars.nIst = `Flow now: ${f1(fy)} °C`;
          }
        entities:
          # Invisible: keeps the margin of the y axis.
          - x: $fn ({ vars }) => vars.padx
            y: $fn ({ vars }) => vars.pady
            mode: markers
            marker:
              opacity: 0
            showlegend: false
            hoverinfo: skip
          - name: $fn ({ vars }) => vars.nOut
            x: $fn ({ vars }) => vars.vx
            y: $fn ({ vars }) => vars.vy
            mode: lines
            line:
              color: "#90a4ae"
              width: 2
              dash: dot
          - name: $fn ({ vars }) => vars.nStart
            x: $fn ({ vars }) => vars.ox
            y: $fn ({ vars }) => vars.st
            mode: markers
            marker:
              color: "#bbdefb"
              size: 14
              symbol: triangle-up
              line:
                color: "#444444"
                width: 1
          - name: $fn ({ vars }) => vars.nStop
            x: $fn ({ vars }) => vars.ox
            y: $fn ({ vars }) => vars.sp
            mode: markers
            marker:
              color: "#ffcdd2"
              size: 14
              symbol: triangle-down
              line:
                color: "#444444"
                width: 1
          - name: Heating curve
            x: $fn ({ vars }) => vars.px
            y: $fn ({ vars }) => vars.py
            mode: lines+markers+text
            text: $fn ({ vars }) => vars.label
            textposition: top center
            textfont:
              size: 12
            line:
              color: "#ff7043"
              width: 3
            marker:
              color: "#ffe0b2"
              size: 9
              line:
                color: "#444444"
                width: 1
          - name: $fn ({ vars }) => vars.nSoll
            x: $fn ({ vars }) => vars.ox
            y: $fn ({ vars }) => vars.sy
            mode: markers
            marker:
              color: "#ffb300"
              size: 15
              symbol: diamond
              line:
                color: "#444444"
                width: 1
          - name: $fn ({ vars }) => vars.nIst
            x: $fn ({ vars }) => vars.ox
            y: $fn ({ vars }) => vars.fy
            mode: markers
            marker:
              color: "#bbdefb"
              size: 13
              line:
                color: "#444444"
                width: 1
        layout:
          height: 400
          separators: ".,"
          font:
            size: 13
          showlegend: true
          legend:
            orientation: h
            x: 0
            xanchor: left
            y: 1.02
            yanchor: bottom
          margin:
            t: 70
            b: 50
            l: 50
            r: 15
          xaxis:
            title:
              text: Outdoor temperature, smoothed (°C)
            range: [22, -17]
            dtick: 5
            fixedrange: true
            zeroline: false
            gridcolor: "rgba(128,128,128,0.25)"
          yaxis:
            title:
              text: Flow (°C)
            range: $fn ({ vars }) => [vars.ylo, vars.yhi]
            dtick: 2
            fixedrange: true
            gridcolor: "rgba(128,128,128,0.25)"
      - type: tile
        entity: sensor.haus_buderus_wps_heating_curve_left_point_display
        name: Curve at +20 °C
        icon: mdi:chart-line
        color: deep-orange
      - type: tile
        entity: sensor.haus_buderus_wps_heating_curve_right_point_display
        name: Curve at −15 °C
        icon: mdi:chart-line
        color: deep-orange
      - type: tile
        entity: sensor.haus_buderus_wps_heating_curve_offset
        name: Parallel offset
        icon: mdi:arrow-up-down
        color: grey
      - type: tile
        entity: sensor.haus_buderus_wps_flow_setpoint
        name: Flow setpoint now
        icon: mdi:target
        color: amber

