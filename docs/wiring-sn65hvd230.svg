<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1110" viewBox="0 0 1400 1110" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .t{font-size:14px;fill:#222}
      .h{font-size:18px;font-weight:700;fill:#1a2b3c}
      .s{font-size:12px;fill:#555}
      .p{font-size:13px;font-weight:600;fill:#222}
      .m{font-size:12.5px;font-family:Consolas, 'Courier New', monospace;fill:#222}
      .warn{font-size:13px;font-weight:700;fill:#c0392b}
      .w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .v12{stroke:#d62728}.v5{stroke:#ff7f0e}.v33{stroke:#e377c2}.gnd{stroke:#222}
      .canh{stroke:#e0b000}.canl{stroke:#2ca02c}
      .tx{stroke:#1f77b4}.rx{stroke:#8c564b}
      .dot{stroke:none}
    </style>
  </defs>

  <rect width="1400" height="1110" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="48" font-size="24" font-weight="700" fill="#1a2b3c">Buderus WPS 8K-1 ⇄ ESP32 (built-in CAN / TWAI) + SN65HVD230</text>
  <text x="40" y="74" class="t">Alternative to the MCP2515: no SPI, no 5 V anywhere · CAN 125 kbit/s · ESPHome esp32_can · LM2596 set to 3.3 V feeds ESP32 + transceiver</text>

  <!-- ===================== Heat pump ===================== -->
  <rect x="40" y="120" width="230" height="390" rx="10" fill="#eef3ee" stroke="#34495e" stroke-width="2"/>
  <text x="140" y="150" class="h" text-anchor="middle">Buderus WPS 8K-1</text>
  <text x="140" y="172" class="t" text-anchor="middle">CAN-bus terminal</text>
  <rect x="222" y="180" width="48" height="285" rx="4" fill="#cfd8dc" stroke="#607d8b"/>
  <g fill="#90a4ae" stroke="#455a64">
    <circle cx="246" cy="200" r="9"/><circle cx="246" cy="300" r="9"/>
    <circle cx="246" cy="400" r="9"/><circle cx="246" cy="440" r="9"/>
  </g>
  <text x="210" y="205" class="p" text-anchor="end">+12 V</text>
  <text x="210" y="305" class="p" text-anchor="end">GND</text>
  <text x="210" y="405" class="p" text-anchor="end">CAN-H</text>
  <text x="210" y="445" class="p" text-anchor="end">CAN-L</text>
  <text x="56" y="482" class="warn">⚠ Mains OFF before opening!</text>
  <text x="56" y="500" class="s">Verify terminal labels + polarity</text>

  <!-- ===================== 12 V path: fuse + diode ===================== -->
  <path class="w v12" d="M270 200 H320"/>
  <rect x="320" y="190" width="60" height="20" rx="3" fill="#fff" stroke="#d62728" stroke-width="2.5"/>
  <line x1="320" y1="200" x2="380" y2="200" stroke="#d62728" stroke-width="1.5"/>
  <text x="350" y="180" class="p" text-anchor="middle">F1 fuse</text>
  <text x="350" y="228" class="s" text-anchor="middle">e.g. 0.5 A PTC</text>
  <path class="w v12" d="M380 200 H440"/>
  <polygon points="440,186 440,214 466,200" fill="#d62728"/>
  <line x1="467" y1="186" x2="467" y2="214" stroke="#d62728" stroke-width="4"/>
  <text x="453" y="180" class="p" text-anchor="middle">D1 1N5819</text>
  <text x="453" y="228" class="s" text-anchor="middle">reverse polarity</text>
  <path class="w v12" d="M467 200 H560"/>
  <text x="300" y="262" class="s">pair 2 of the cable: 12 V / GND</text>

  <!-- GND pump -> LM2596 IN- -->
  <path class="w gnd" d="M270 300 H560"/>

  <!-- ===================== LM2596 ===================== -->
  <rect x="560" y="140" width="220" height="190" rx="10" fill="#e8f1fb" stroke="#34495e" stroke-width="2"/>
  <text x="670" y="168" class="h" text-anchor="middle">LM2596 buck</text>
  <text x="670" y="188" class="t" text-anchor="middle">12 V → 3.3 V</text>
  <circle cx="670" cy="225" r="13" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
  <line x1="662" y1="225" x2="678" y2="225" stroke="#fff" stroke-width="3"/>
  <text x="670" y="258" class="warn" text-anchor="middle">set 3.30 V with multimeter</text>
  <text x="670" y="275" class="warn" text-anchor="middle">BEFORE connecting loads!</text>
  <text x="572" y="205" class="p">IN+</text>
  <text x="572" y="305" class="p">IN−</text>
  <text x="768" y="205" class="p" text-anchor="end">OUT+</text>
  <text x="768" y="305" class="p" text-anchor="end">OUT−</text>

  <!-- ===================== 3.3 V + GND to ESP32 and transceiver ===================== -->
  <path class="w v33" d="M780 200 H1080"/>
  <path class="w gnd" d="M780 300 H1080"/>
  <path class="w v33" d="M960 200 V470 H860"/>
  <path class="w gnd" d="M1010 300 V500 H860"/>
  <text x="930" y="174" class="warn" text-anchor="middle">3.3 V into the ESP32 3V3 pin – NOT VIN/5V</text>
  <text x="930" y="190" class="s" text-anchor="middle">bypasses the onboard regulator · max 3.6 V!</text>

  <!-- ===================== CAN pair ===================== -->
  <path class="w canh" d="M270 400 H520 V520 H600"/>
  <path class="w canl" d="M270 440 H490 V560 H600"/>
  <text x="300" y="388" class="s">pair 1: twisted pair CAN-H / CAN-L</text>

  <!-- ===================== SN65HVD230 module ===================== -->
  <rect x="600" y="430" width="260" height="290" rx="10" fill="#f3eefb" stroke="#34495e" stroke-width="2"/>
  <text x="730" y="456" class="h" text-anchor="middle">SN65HVD230 module</text>
  <text x="612" y="476" class="s">3.3 V transceiver (e.g. VP230)</text>
  <rect x="606" y="505" width="26" height="70" rx="3" fill="#2e7d32" stroke="#1b5e20"/>
  <text x="619" y="525" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">H</text>
  <text x="619" y="565" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">L</text>
  <rect x="670" y="510" width="120" height="50" rx="4" fill="#37474f"/>
  <text x="730" y="532" font-size="13" fill="#fff" text-anchor="middle">SN65HVD230</text>
  <text x="730" y="549" font-size="11" fill="#cfd8dc" text-anchor="middle">D ← · → R · Rs</text>
  <rect x="640" y="590" width="48" height="26" rx="3" fill="#ffd54f" stroke="#8d6e00"/>
  <text x="664" y="608" font-size="12" font-weight="700" text-anchor="middle">120 Ω</text>
  <text x="700" y="600" class="warn">onboard term.:</text>
  <text x="700" y="616" class="warn">check first</text>
  <text x="616" y="650" class="s">Check termination at the network ends.</text>
  <text x="616" y="666" class="s">Measure only when safely powered off;</text>
  <text x="616" y="682" class="s">≈ 60 Ω alone does not prove it is correct.</text>
  <text x="616" y="704" class="s">Rs: verify board's operating mode</text>
  <text x="848" y="475" class="p" text-anchor="end">3V3</text>
  <text x="848" y="505" class="p" text-anchor="end">GND</text>
  <text x="848" y="565" class="p" text-anchor="end">CTX (D)</text>
  <text x="848" y="625" class="p" text-anchor="end">CRX (R)</text>

  <!-- ===================== TX, RX ===================== -->
  <path class="w tx" d="M1080 560 H860"/>
  <polygon points="890,552 874,560 890,568" fill="#1f77b4"/>
  <path class="w rx" d="M860 620 H1080"/>
  <polygon points="1050,612 1066,620 1050,628" fill="#8c564b"/>
  <text x="970" y="548" class="s" text-anchor="middle">ESP32 sends → transceiver</text>
  <text x="970" y="608" class="s" text-anchor="middle">transceiver receives → ESP32</text>
  <text x="910" y="458" class="s" text-anchor="middle">3.3 V from buck</text>
  <text x="872" y="660" class="s">ESP32 TX → transceiver D (input).</text>
  <text x="872" y="676" class="s">Transceiver R (output) → ESP32 RX.</text>
  <text x="872" y="692" class="s">Pin names vary; check the actual</text>
  <text x="872" y="708" class="s">board's schematic and silkscreen.</text>

  <!-- ===================== ESP32 ===================== -->
  <rect x="1080" y="140" width="260" height="610" rx="10" fill="#fdf3e7" stroke="#34495e" stroke-width="2"/>
  <rect x="1150" y="152" width="120" height="40" rx="3" fill="#cfd8dc" stroke="#90a4ae"/>
  <path d="M1160 182 V162 H1175 V182 H1190 V162 H1205 V182 H1220 V162 H1235 V182 H1250 V162 H1260" fill="none" stroke="#455a64" stroke-width="2"/>
  <rect x="1150" y="330" width="120" height="100" rx="4" fill="#90a4ae" stroke="#607d8b"/>
  <text x="1210" y="375" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">ESP32</text>
  <text x="1210" y="395" font-size="12" fill="#fff" text-anchor="middle">WROOM-32</text>
  <text x="1210" y="414" font-size="11" fill="#fff" text-anchor="middle">+ TWAI controller</text>
  <text x="1210" y="680" class="h" text-anchor="middle">ESP32 DevKit</text>
  <text x="1210" y="700" class="s" text-anchor="middle">board: esp32dev · SPI pins now free</text>
  <text x="1092" y="205" class="p">3V3 (power in)</text>
  <text x="1092" y="223" class="s">VIN/5V: leave open</text>
  <text x="1092" y="305" class="p">GND</text>
  <text x="1092" y="565" class="p">GPIO22 · CAN TX</text>
  <text x="1092" y="625" class="p">GPIO21 · CAN RX</text>
  <rect x="1185" y="735" width="50" height="22" rx="3" fill="#b0bec5" stroke="#607d8b"/>
  <text x="1210" y="751" font-size="11" font-weight="700" text-anchor="middle">USB</text>
  <text x="1210" y="778" class="s" text-anchor="middle">flash at the desk, then OTA</text>
  <text x="1210" y="796" class="warn" text-anchor="middle">never USB + buck at the same time</text>

  <!-- pin dots -->
  <g class="dot">
    <circle cx="270" cy="200" r="5" fill="#d62728"/><circle cx="270" cy="300" r="5" fill="#222"/>
    <circle cx="270" cy="400" r="5" fill="#e0b000"/><circle cx="270" cy="440" r="5" fill="#2ca02c"/>
    <circle cx="560" cy="200" r="5" fill="#d62728"/><circle cx="560" cy="300" r="5" fill="#222"/>
    <circle cx="780" cy="200" r="5" fill="#e377c2"/><circle cx="780" cy="300" r="5" fill="#222"/>
    <circle cx="960" cy="200" r="7" fill="#e377c2"/><circle cx="1010" cy="300" r="7" fill="#222"/>
    <circle cx="600" cy="520" r="5" fill="#e0b000"/><circle cx="600" cy="560" r="5" fill="#2ca02c"/>
    <circle cx="860" cy="470" r="5" fill="#e377c2"/><circle cx="860" cy="500" r="5" fill="#222"/>
    <circle cx="860" cy="560" r="5" fill="#1f77b4"/><circle cx="860" cy="620" r="5" fill="#8c564b"/>
    <circle cx="1080" cy="200" r="5" fill="#e377c2"/><circle cx="1080" cy="300" r="5" fill="#222"/>
    <circle cx="1080" cy="560" r="5" fill="#1f77b4"/><circle cx="1080" cy="620" r="5" fill="#8c564b"/>
  </g>

  <!-- ===================== ESPHome snippet ===================== -->
  <rect x="40" y="560" width="420" height="220" rx="10" fill="#f4f6f8" stroke="#b0bec5"/>
  <text x="56" y="588" class="h">ESPHome config (buderus-wps.yaml)</text>
  <text x="56" y="612" class="m" xml:space="preserve">canbus:</text>
  <text x="56" y="628" class="m" xml:space="preserve">  - platform: esp32_can</text>
  <text x="56" y="644" class="m" xml:space="preserve">    id: can0</text>
  <text x="56" y="660" class="m" xml:space="preserve">    rx_pin: GPIO21</text>
  <text x="56" y="676" class="m" xml:space="preserve">    tx_pin: GPIO22</text>
  <text x="56" y="692" class="m" xml:space="preserve">    bit_rate: 125KBPS</text>
  <text x="56" y="708" class="m" xml:space="preserve">    mode: LISTENONLY</text>
  <text x="56" y="724" class="m" xml:space="preserve">    can_id: 0x01FD7FE0</text>
  <text x="56" y="740" class="m" xml:space="preserve">    use_extended_id: true</text>
  <text x="290" y="708" class="s"># passive first!</text>

  <!-- ===================== Legend ===================== -->
  <rect x="40" y="820" width="360" height="270" rx="10" fill="#fafafa" stroke="#b0bec5"/>
  <text x="56" y="848" class="h">Legend</text>
  <g>
    <path class="w v12" d="M56 872 H96"/><text x="108" y="877" class="t">+12 V from heat pump</text>
    <path class="w v33" d="M56 898 H96"/><text x="108" y="903" class="t">+3.3 V from LM2596 → ESP32 3V3 + SN65</text>
    <path class="w gnd" d="M56 924 H96"/><text x="108" y="929" class="t">GND (common to all parts)</text>
    <path class="w canh" d="M56 950 H96"/><text x="108" y="955" class="t">CAN-H</text>
    <path class="w canl" d="M56 976 H96"/><text x="108" y="981" class="t">CAN-L</text>
    <path class="w tx" d="M56 1002 H96"/><text x="108" y="1007" class="t">CAN TX (ESP32 → transceiver)</text>
    <path class="w rx" d="M56 1028 H96"/><text x="108" y="1033" class="t">CAN RX (transceiver → ESP32)</text>
    <circle cx="76" cy="1054" r="7" fill="#222"/><text x="108" y="1059" class="t">● = junction · crossing without dot = not connected</text>
  </g>

  <!-- ===================== BOM ===================== -->
  <rect x="420" y="820" width="940" height="270" rx="10" fill="#fafafa" stroke="#b0bec5"/>
  <text x="436" y="848" class="h">Parts list</text>
  <g class="t">
    <text x="436" y="876">1 · ESP32 DevKit (ESP32-WROOM-32, “esp32dev”) – unchanged</text>
    <text x="436" y="900">2 · SN65HVD230 CAN transceiver module, 3.3 V (≈ €2–5)</text>
    <text x="436" y="924">3 · LM2596 buck, set to 3.30 V (or fixed 3.3 V module, ≥ 1 A)</text>
    <text x="436" y="948">4 · F1 fuse + D1 1N5819 – unchanged</text>
    <text x="436" y="972">5 · Wires: buck → ESP32 3V3/GND + SN65 3V3/GND, TX, RX</text>
    <text x="436" y="996" fill="#888">✗ not needed: MCP2515, level shifter, 5 V rail</text>
    <text x="920" y="876">6 · Cable 2×2×0.6/0.8 twisted pair,</text>
    <text x="942" y="894">e.g. J-Y(St)Y 2×2×0.8 or CAT5/6</text>
    <text x="920" y="920">7 · Opt.: TVS across 12 V input,</text>
    <text x="942" y="938">electrolytic cap at LM2596 IN</text>
    <text x="920" y="964">8 · Perfboard / screw terminals,</text>
    <text x="942" y="982">enclosure, strain relief</text>
    <text x="436" y="1030" class="s">3V3 rail must stay 3.0–3.6 V: SN65HVD230 abs. max ≈ 4 V, ESP32 3.6 V. Re-measure after the buck has warmed up; seal the trimmer.</text>
    <text x="436" y="1050" class="s">GPIO21/22 are not strapping pins and free on WROOM-32 (default I2C pins, unused here). SN65HVD230 works with 5 V transceivers on the bus.</text>
    <text x="436" y="1070" class="s">Pin order on the heat pump terminal varies – always measure +12 V vs. GND with a multimeter before connecting.</text>
  </g>
</svg>
